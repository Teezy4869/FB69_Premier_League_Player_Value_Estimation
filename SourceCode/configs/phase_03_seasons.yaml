# Official EPL season cutoffs for FB69 Phase 3. target cutoff = official season end date, read as a plain date.
# Two independent datasets also agree on these dates: frozen FotMob fixtures and Transfermarkt games.
# `official_evidence_basis` says how each page was read on 2026-11-04.
selection_rule_version: latest_valid_on_or_before_season_end_v1
# Labels age only. It is NOT an exclusion rule: stale rows stay usable, and exact ages are kept.
stale_label_days: 90
