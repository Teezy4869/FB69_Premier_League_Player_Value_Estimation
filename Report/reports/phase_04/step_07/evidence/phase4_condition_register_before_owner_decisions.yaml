# FB69 Phase 4.0 condition register (machine-readable).
# This file is the single structured source for Phase 4 conditions. PHASE4_CONDITION_REGISTER.md is rendered from it.
# It does NOT replace or override: configs/research_scope.yaml (scope), data_dictionary.csv (column roles),
# the release docs (evidence), or reports/research_scope_rs5/step_04/ISSUE_TRACKER.md (issue history).
# Issue ids from the rs5 tracker are kept; P4-* ids are added only for conditions that had no id.
# Conditions carry an optional `status` and `resolution`. Without a status, a condition is OPEN.
# The only resolutions recorded here are those stated in an owner prompt or delegated technical decisions (each says which).
# Every other "owner_approval_required: true" item is still open.
