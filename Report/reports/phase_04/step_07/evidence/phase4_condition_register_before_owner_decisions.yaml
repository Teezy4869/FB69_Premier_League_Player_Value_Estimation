    classification: B
    also: D
    description: "Minutes, appearances and starts have Spearman about 0.53 with the target, and most season totals inherit their association from playing time (partial Spearman given starts: appearances 0.14, tackles -0.05, recoveries -0.05, duels won 0.09). Given starts, defensive totals turn negative (interceptions -0.18, blocked shots -0.22, clearances -0.23) and goalkeeper saves and goals conceded change sign (+0.53 to -0.22; +0.47 to -0.29). A team-strength or team-style confounder is plausible but cannot be examined while club context is pending (RS5-12). 54 outfield feature pairs have |Spearman| >= 0.8 and four redundancy clusters link features at >= 0.9 (playing-time volumes; shots and xG; shot rates; xA and chances created)."
    evidence: "reports/phase_04/step_03/evidence/feature_target_association.csv (partial_spearman_given_*), strong_feature_pairs_outfield.csv, redundancy_clusters_outfield.csv"
    affected: Season-total m_* metrics, goalkeeper volume metrics, any interpretation of feature-target associations
    required_action: "Read volume associations together with playing time; never report a raw volume correlation as a performance effect. Do not remove or merge correlated features in EDA; the representation (totals, rates, or both) is a feature-design decision (P4-D03). Revisit the team-context hypothesis if RS5-12 is decided."
    responsible_stage: Interpretation; feature design
    owner_approval_required: false
    blocks_phase_4_1: false
    blocks_final_modeling: false
    target_phase: "4.4 onward"
