    affected: Target vs all m_* and position_group_season
    required_action: "Report the mismatch with every relationship; never read it as performance causing the earlier valuation. Owner decision still open: keep D4 and report (default) or approve a new rule (new version). Claude Code must not change D4/D6."
    responsible_stage: All Phase 4 steps; owner
    owner_approval_required: true
    blocks_phase_4_1: false
    blocks_final_modeling: false
    target_phase: "4.1 onward (interpretation); decision before final modeling report"
